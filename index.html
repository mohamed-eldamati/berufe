<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Berufe</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8eff8;--ink:#13294b;--mute:#6b7a92;--m:#1f5fd6;--mb:#e6eefc;--f:#c8235f;--fb:#fde8f0;--ok:#1f9d55;--no:#d93a3a;--yel:#ffc83d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root{color-scheme:light}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif}
header{max-width:1020px;margin:0 auto;padding:22px 18px 6px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:30px;font-weight:900;letter-spacing:-.5px}
nav{display:flex;gap:4px;background:#fff;padding:5px;border-radius:99px;box-shadow:0 2px 10px #1b3a6d14}
button{font:inherit;color:inherit;cursor:pointer}
nav button{border:0;background:none;padding:8px 22px;border-radius:99px;font-weight:800;font-size:15px}
nav button[aria-selected="true"]{background:var(--ink);color:#fff}
button:focus-visible{outline:3px solid var(--m);outline-offset:2px}
main{max-width:1020px;margin:0 auto;padding:4px 18px 44px}
.cat{margin:28px 0 12px;font-size:21px;font-weight:900;display:flex;align-items:center;gap:10px}
.ico{width:34px;height:34px;border-radius:10px;background:var(--yel);display:grid;place-items:center;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 4px 16px #1b3a6d14}
.card img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.row{display:grid;grid-template-columns:1fr 1fr}
.col{padding:10px;display:flex;flex-direction:column;gap:8px}
.col.m{background:var(--mb)}.col.f{background:var(--fb)}
.col>span{font-size:11px;font-weight:800}
.col.m>span{color:var(--m)}.col.f>span{color:var(--f)}
.w{display:flex;align-items:center;justify-content:space-between;gap:6px;background:#fff;border:2px solid;border-radius:12px;padding:8px 10px;font-weight:900;font-size:16px;text-align:left;word-break:break-word;hyphens:auto}
.m .w{border-color:var(--m);color:var(--m)}.f .w{border-color:var(--f);color:var(--f)}
.w:hover{transform:translateY(-1px)}
.w::after{content:"🔊";font-size:12px;opacity:.55;flex:none}
.game{max-width:580px;margin:10px auto 0}
.bar{height:10px;border-radius:9px;background:#fff;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--yel),var(--ok));transition:width .35s}
.stats{display:flex;justify-content:space-between;font-weight:800;margin:12px 2px;font-size:15px}
.stage{background:#fff;border-radius:26px;overflow:hidden;box-shadow:0 6px 22px #1b3a6d18}
.stage img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.pad{padding:18px 16px 20px}
.q{text-align:center;font-weight:900;font-size:19px;margin-bottom:14px}
.tag{display:inline-block;padding:1px 14px;border-radius:99px}
.tag.m{background:var(--mb);color:var(--m)}.tag.f{background:var(--fb);color:var(--f)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{background:#fff;border:2px solid #d5deec;border-radius:16px;padding:14px 6px;font-size:18px;font-weight:900;word-break:break-word}
.opt:hover{border-color:var(--ink)}
.opt.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.no{border-color:var(--no);color:var(--no);background:#fff3f3;animation:sh .35s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media(prefers-reduced-motion:reduce){.opt.no{animation:none}.bar i{transition:none}}
.end{text-align:center;padding:36px 12px;background:#fff;border-radius:26px}
.end b{font-size:64px;display:block}
.go{background:var(--ink);color:#fff;border:0;border-radius:99px;padding:13px 30px;font-weight:900;font-size:16px;margin-top:14px}
.hint{color:var(--mute);font-size:14px;font-weight:700}
</style>
</head>
<body>
<header>
<h1>🎓 Berufe</h1>
<nav role="tablist"><button role="tab" id="t1" aria-selected="true">Lernen</button><button role="tab" id="t2" aria-selected="false">Spiel</button></nav>
</header>
<main>

const D=[
["🎤","Kunst und Medien",[["Schauspieler","Schauspielerin"],["Sänger","Sängerin"],["Journalist","Journalistin"]]],
["💼","Dienstleistung und Büro",[["Verkäufer","Verkäuferin"],["Friseur","Friseurin"],["Sekretär","Sekretärin"]]],
["🚒","Öffentlicher Dienst",[["Polizist","Polizistin"],["Feuerwehrmann","Feuerwehrfrau"],["Pilot","Pilotin"]]],
["🌾","Landwirtschaft und Essen",[["Bauer","Bäuerin"],["Bäcker","Bäckerin"],["Koch","Köchin"],["Kellner","Kellnerin"]]],
["📚","Bildung",[["Lehrer","Lehrerin"],["Erzieher","Erzieherin"],["Student","Studentin"]]],
["🔧","Technik und Handwerk",[["Programmierer","Programmiererin"],["Ingenieur","Ingenieurin"],["Architekt","Architektin"],["Mechatroniker","Mechatronikerin"],["Mechaniker","Mechanikerin"],["Elektriker","Elektrikerin"],["Handwerker","Handwerkerin"]]],
["🩺","Gesundheit",[["Arzt","Ärztin"],["Krankenpfleger","Krankenschwester"],["Apotheker","Apothekerin"]]],
["⚖️","Recht",[["Jurist","Juristin"],["Anwalt","Anwältin"]]]
];
const ALL=[];D.forEach(c=>c[2].forEach(p=>ALL.push({m:p[0],f:p[1],img:IMG[p[0]]})));
const $=s=>document.querySelector(s);
function say(t){try{const u=new SpeechSynthesisUtterance(t);u.lang="de-DE";u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
$("#learn").innerHTML=D.map(c=>`<h2 class="cat"><span class="ico">${c[0]}</span>${c[1]}</h2><div class="grid">${c[2].map(p=>`<div class="card"><img src="${IMG[p[0]]}" alt="${p[0]}"><div class="row"><div class="col m"><span>männlich</span><button class="w" data-s="der ${p[0]}">der ${p[0]}</button></div><div class="col f"><span>weiblich</span><button class="w" data-s="die ${p[1]}">die ${p[1]}</button></div></div></div>`).join("")}</div>`).join("");
$("#learn").onclick=e=>{const b=e.target.closest("[data-s]");if(b)say(b.dataset.s)};
function tab(n){$("#t1").setAttribute("aria-selected",n==1);$("#t2").setAttribute("aria-selected",n==2);$("#learn").hidden=n!=1;$("#game").hidden=n!=2;if(n==2)start()}
$("#t1").onclick=()=>tab(1);$("#t2").onclick=()=>tab(2);
const N=10;let Q,i,score,streak,best=0,lock;
try{best=+localStorage.getItem("berufe-best")||0}catch(e){}
const sh=a=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
function start(){Q=sh(ALL).slice(0,N).map(p=>({p,g:Math.random()<.5?"m":"f"}));i=0;score=0;streak=0;show()}
function show(){
 if(i>=N){try{if(score>best){best=score;localStorage.setItem("berufe-best",best)}}catch(e){}
  $("#game").innerHTML=`<div class="end"><b>${score}/${N}</b><div class="q">${score>=9?"Hervorragend! 🏆":score>=6?"Gut gemacht! 👏":"Weiter üben! 💪"}</div><p class="hint">Bestes Ergebnis: ${best}</p><button class="go" id="again">Nochmal spielen</button></div>`;$("#again").onclick=start;return}
 const {p,g}=Q[i],right=p[g],pool=sh(ALL.filter(x=>x!==p)).slice(0,3).map(x=>x[g]),opts=sh([right,...pool]),art=g=="m"?"der":"die";
 lock=false;
 $("#game").innerHTML=`<div class="bar"><i style="width:${i/N*100}%"></i></div><div class="stats"><span>Frage ${i+1} / ${N}</span><span>⭐ ${score} &nbsp; 🔥 ${streak}</span></div>
 <div class="stage"><img src="${p.img}" alt=""><div class="pad"><div class="q">Wie heißt der Beruf <span class="tag ${g}">${g=="m"?"männlich":"weiblich"}</span>?</div>
 <div class="opts">${opts.map(o=>`<button class="opt" data-o="${o}">${art} ${o}</button>`).join("")}</div></div></div>`;
 document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(b,right,art));
}
function pick(b,right,art){
 if(lock)return;const v=b.dataset.o;
 if(v==right){lock=true;b.classList.add("ok");say(art+" "+v);score++;streak++;i++;setTimeout(show,1000)}
 else{b.classList.add("no");b.disabled=true;streak=0}
}
</script>
